<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1430">
<title>Critter Survivor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23ff7a3d'/%3E%3Cpath d='M7 12l3-9 6 7zM25 12l-3-9-6 7z' fill='%23ff7a3d'/%3E%3Ccircle cx='12' cy='17' r='2' fill='%23101428'/%3E%3Ccircle cx='20' cy='17' r='2' fill='%23101428'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0a1430; --panel:#121d44; --panel2:#16224a; --line:#2c3d78; --fg:#f3f6ff; --accent:#ffd84a; --muted:#8fa2d0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  canvas#c { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  .screen { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:16px; background:rgba(5,10,28,.9); overflow-y:auto; touch-action:pan-y; }
  .hidden { display:none !important; }
  .card { max-width:640px; width:100%; margin:auto; text-align:center; }
  h1 { margin:0 0 6px; font-size:32px; color:var(--accent); letter-spacing:1px; }
  h2 { margin:0 0 8px; font-size:22px; color:var(--accent); }
  p { margin:6px 0; color:var(--muted); line-height:1.4; }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:12px; padding:12px 20px; background:var(--accent); color:#0a1430; margin:5px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#1c2a55; color:var(--fg); }
  button.gold { background:linear-gradient(180deg,#ffe27a,#ffb200); }
  .row { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
  .pick { display:block; width:100%; text-align:left; background:var(--panel2); color:var(--fg); border:2px solid var(--line); padding:12px 14px; margin:8px 0; }
  .pick:hover,.pick:focus { border-color:var(--accent); outline:0; }
  .pick b { color:var(--accent); display:block; }
  .pick small { color:var(--muted); font-weight:400; }
  #stat { position:fixed; top:8px; left:8px; right:8px; pointer-events:none; font-weight:700; text-shadow:0 1px 2px #000; display:flex; justify-content:space-between; gap:8px; font-size:14px; }
  #slots { position:fixed; top:30px; left:8px; pointer-events:none; font-size:12px; text-shadow:0 1px 2px #000; line-height:1.5; }
  #slots span { display:block; color:#cfe0ff; }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin:10px 0; }
  .cell { background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:6px 4px; text-align:center; font-size:12px; cursor:pointer; position:relative; }
  .cell img { width:56px; height:56px; object-fit:contain; image-rendering:pixelated; display:block; margin:0 auto 2px; }
  .cell.locked img { filter:brightness(0) opacity(.55); }
  .cell.sel { box-shadow:0 0 0 3px var(--accent); }
  .cell small { display:block; color:var(--muted); font-size:10px; }
  .detail { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:left; margin-top:10px; }
  .detail img { width:84px; height:84px; object-fit:contain; image-rendering:pixelated; float:left; margin-right:10px; }
  .moves { margin:8px 0 0; padding:0; list-style:none; clear:both; font-size:13px; }
  .moves li { padding:4px 0; border-top:1px solid #22305f; color:#cfe0ff; }
  .moves li small { color:var(--muted); display:block; }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:#0a1430; margin-left:6px; }
  #wheelwrap { position:relative; width:min(340px,86vw); margin:8px auto; }
  #wheel { width:100%; height:auto; display:block; }
  #pointer { position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:24px solid var(--accent); filter:drop-shadow(0 2px 2px #000); }
  .rates { font-size:12px; color:var(--muted); }
  .modal { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(3,6,18,.85); }
  .mcard { background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:16px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto; text-align:center; }
  .res { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:10px 0; }
  .res .cell { width:92px; cursor:default; }
  .big { width:130px; height:130px; object-fit:contain; image-rendering:pixelated; }
  @media (max-width:420px){ h1{font-size:26px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stat" class="hidden"><span id="sLv"></span><span id="sTime"></span><span id="sKills"></span></div>
<div id="slots" class="hidden"></div>

<!-- MENU -->
<div id="menu" class="screen hidden">
  <div class="card">
    <h1>Critter Survivor</h1>
    <p>Sobreviva 10 minutos. Seu animal ataca sozinho: você só se move.</p>
    <div class="chips"><span class="chip" id="chipFree"></span><span class="chip" id="chipGold"></span><span class="chip" id="chipBest"></span></div>
    <div id="menuSel" style="margin:6px 0"></div>
    <div class="row">
      <button id="bPlay">Jogar</button>
      <button id="bColl" class="ghost">Coleção</button>
      <button id="bRoul" class="gold">Roleta</button>
      <button id="bQuiz" class="ghost">Refazer quiz</button>
    </div>
    <p style="font-size:12px"><b>PC:</b> WASD / setas &nbsp; <b>Celular:</b> arraste na tela</p>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div class="card">
    <h2 id="qProg"></h2>
    <p id="qText" style="color:var(--fg);font-size:18px"></p>
    <div id="qOpts"></div>
  </div>
</div>

<!-- RESULTADO DO QUIZ / REVELAÇÃO -->
<div id="reveal" class="screen hidden">
  <div class="card">
    <h2 id="rvTitle"></h2>
    <img id="rvImg" class="big" alt="Animal sorteado" src="assets/animals/a24.png">
    <h1 id="rvName" style="font-size:28px"></h1>
    <p id="rvWhy"></p>
    <div id="rvMoves" class="detail" style="text-align:left"></div>
    <button id="rvOk">Continuar</button>
  </div>
</div>

<!-- COLEÇÃO -->
<div id="coll" class="screen hidden">
  <div class="card">
    <h2>Coleção <span id="collCount" class="tag"></span></h2>
    <div id="collGrid" class="grid"></div>
    <div id="collDetail" class="detail hidden"></div>
    <button id="collBack" class="ghost">Voltar</button>
  </div>
</div>

<!-- ROLETA -->
<div id="roul" class="screen hidden">
  <div class="card">
    <h2>Roleta de Animais</h2>
    <div class="chips"><span class="chip" id="rFree"></span><span class="chip" id="rGold"></span></div>
    <div id="wheelwrap"><div id="pointer"></div><canvas id="wheel" width="340" height="340"></canvas></div>
    <div class="row">
      <button id="spin1">Girar (1 ticket)</button>
      <button id="spin10">Girar ×10</button>
      <button id="gspin1" class="gold">Dourado ×1</button>
      <button id="gspin10" class="gold">Dourado ×10</button>
    </div>
    <div class="row"><button id="bBuy" class="gold">Comprar tickets dourados</button><button id="rBack" class="ghost">Voltar</button></div>
    <p class="rates" id="rRates"></p>
  </div>
</div>

<!-- LEVEL UP -->
<div id="levelup" class="screen hidden" style="background:rgba(5,10,28,.82)">
  <div class="card"><h1>Nível!</h1><p>Escolha um upgrade</p><div id="picks"></div></div>
</div>

<!-- FIM -->
<div id="end" class="screen hidden" style="background:rgba(5,10,28,.88)">
  <div class="card"><h1 id="endTitle"></h1><p id="endInfo"></p><div class="row"><button id="again">Jogar de novo</button><button id="toMenu" class="ghost">Menu</button></div></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden"><div class="mcard" id="mcard"></div></div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
